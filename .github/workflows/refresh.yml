name: Refresh console

on:
  schedule:
    - cron: "30 4 * * *"      # 10:00 IST daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (pipeline + Streamlit AppTest)
        run: python -m unittest discover -s tests -v

      - name: Generate synthetic spend and leads
        run: python pipeline/generate_synthetic.py --out data --days 120

      - name: Join, aggregate, compute what moved
        run: python pipeline/transform.py --data data --out site/data.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
